
name: pg_app
description: PG / hostel management app - Tenant, Manager, Owner.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon_1024_rounded.png
# Android and iOS Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true

  image_path_android: "assets/app_icon.png"
  image_path_ios: "assets/ios_app_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

  # Remove transparency for iOS
  remove_alpha_ios: true

# Native Splash Screen
flutter_native_splash:
  color: "#1B7F6B"
  image: assets/logo.png

  android_12:
    color: "#1B7F6B"
    image: assets/logo.png
